name: Validate Plumbline

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate.py
      - run: python scripts/test_router.py
      - run: python scripts/test_install_agent_team.py
      - run: python scripts/test_install_claude_agent_team.py
